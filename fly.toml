# Fly.io app config — shitcoin-scanner
# Docs: https://fly.io/docs/reference/configuration/
#
# Deploy web dashboard:
#   fly launch --no-deploy   # if first time (or use existing app name)
#   fly volumes create scanner_data --region cdg --size 1
#   fly secrets set BYBIT_API_KEY=... BYBIT_API_SECRET=...
#   fly deploy
#
# Daily cron (post-close UTC) — one-shot scheduled machine from same image:
#   fly machine run . --region cdg --schedule "15 0 * * *" \
#     --env DATA_ROOT=/data \
#     --command "python run_daily.py --no-refresh --skip-dashboard" \
#     --volume scanner_data:/data

app = "shitcoin-scanner"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_ROOT = "/data"
  BIND_HOST = "0.0.0.0"
  PORT = "8080"
  BYBIT_ENV = "mainnet"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Persistent state: live book, OHLC cache, logs
# Create once: fly volumes create scanner_data --region cdg --size 1
[mounts]
  source = "scanner_data"
  destination = "/data"
  initial_size = "1gb"
