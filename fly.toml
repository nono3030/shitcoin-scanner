# Fly.io app config — shitcoin-scanner
# IMPORTANT: do NOT use the empty "fly launch plan propose" wizard without
# a local checkout. From the repo root (where Dockerfile lives):
#
#   fly apps create shitcoin-scanner -o <your-org>
#   fly volumes create scanner_data --region fra --size 1 -a shitcoin-scanner
#   fly secrets set BYBIT_API_KEY=... BYBIT_API_SECRET=... -a shitcoin-scanner
#   fly deploy -a shitcoin-scanner --dockerfile Dockerfile
#
# Cron later:
#   fly machine run . -a shitcoin-scanner --region fra --schedule "15 0 * * *" \
#     --env DATA_ROOT=/data --command "sh scripts/fly_daily.sh" \
#     --volume scanner_data:/data --restart no

app = "shitcoin-scanner"
primary_region = "fra"

[build]
  # Explicit — required so Fly never "detects" empty source
  dockerfile = "Dockerfile"
  ignorefile = ".dockerignore"

[env]
  DATA_ROOT = "/data"
  BIND_HOST = "0.0.0.0"
  PORT = "8080"
  BYBIT_ENV = "mainnet"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Create once before first deploy:
#   fly volumes create scanner_data --region fra --size 1 -a shitcoin-scanner
[mounts]
  source = "scanner_data"
  destination = "/data"
