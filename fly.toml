# Fly.io — dashboard + daily job (same machine, volume /data)
#
# Deploy:
#   fly deploy -a shitcoin-scanner --dockerfile Dockerfile --remote-only --yes
#
# Daily trading: 00:15 UTC (after 00:00 UTC daily close), window 00–04 UTC in config.

app = "shitcoin-scanner"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"
  ignorefile = ".dockerignore"

[env]
  DATA_ROOT = "/data"
  BIND_HOST = "0.0.0.0"
  PORT = "8080"
  BYBIT_ENV = "mainnet"
  PYTHONUNBUFFERED = "1"
  PYTHONPATH = "/app"
  DAILY_RUN_UTC_HOUR = "0"
  DAILY_RUN_UTC_MINUTE = "15"
  CATCH_UP_ON_BOOT = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # MUST stay up for midnight scheduler — do not auto-stop
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "scanner_data_sin"
  destination = "/data"
